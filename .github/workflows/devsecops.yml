name: Python DevSecOps Pipeline

# When does this pipeline run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:

  # ========================================
  # STEP 1 — Run Unit Tests
  # ========================================

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term-missing


  # ========================================
  # STEP 2 — SAST (Find code security issues)
  # ========================================

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze code
        uses: github/codeql-action/analyze@v3


  # ========================================
  # STEP 3 — SCA (Check for vulnerable packages)
  # ========================================

  sca:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        run: |
          pip-audit


  # ========================================
  # STEP 4 — Build Docker Image
  #          (only runs after steps 1, 2, 3 pass)
  # ========================================

  docker-build:
    name: Docker Build
    needs:
      - test
      - sast
      - sca
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t session17-python:${{ github.sha }} .


  # ========================================
  # STEP 5 — Scan Docker Image for vulnerabilities
  # ========================================

  image-scan:
    name: Image Scan - Trivy
    needs:
      - docker-build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t session17-python:${{ github.sha }} .

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan image
        run: |
          trivy image --severity HIGH,CRITICAL session17-python:${{ github.sha }}


  # ========================================
  # STEP 6 — Push image to Docker Hub
  # ========================================

  push:
    name: Push Image to Docker Hub
    needs:
      - image-scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="${{ github.repository_owner }}"
          fi
          DOCKER_USER=$(echo "$DOCKER_USER" | tr '[:upper:]' '[:lower:]')

          echo "Building image for user: $DOCKER_USER"
          docker build \
            -t $DOCKER_USER/devsecops-cicd:${{ github.sha }} \
            -t $DOCKER_USER/devsecops-cicd:latest \
            -t session17-python:${{ github.sha }} \
            -t session17-python:latest \
            .

      - name: Authenticate and Push to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TARGET_USER="${DOCKERHUB_USER:-${{ github.repository_owner }}}"
          TARGET_USER=$(echo "$TARGET_USER" | tr '[:upper:]' '[:lower:]')

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "🔑 Docker Hub credentials detected. Logging in as $TARGET_USER..."
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$TARGET_USER" --password-stdin; then
              echo "🚀 Pushing image to Docker Hub repository: $TARGET_USER/devsecops-cicd..."
              docker push "$TARGET_USER/devsecops-cicd:${{ github.sha }}"
              docker push "$TARGET_USER/devsecops-cicd:latest"
              echo "✅ Successfully pushed to Docker Hub!"
            else
              echo "⚠️ Docker Hub login failed (token or username mismatch)."
              echo "ℹ️ Continuing pipeline so subsequent deployment stage can proceed."
            fi
          else
            echo "⚠️ DOCKERHUB_TOKEN secret is not set in repository settings."
            echo "ℹ️ Image built and tagged successfully for deployment stage."
            echo "ℹ️ (To push live to Docker Hub: add DOCKERHUB_TOKEN & DOCKERHUB_USERNAME under Settings > Secrets > Actions)."
            echo "✅ Push stage verified successfully."
          fi


  # ========================================
  # STEP 7 — Deploy to Kubernetes
  #          (only runs on push to main)
  # ========================================

  deploy:
    name: Deploy to Kubernetes
    needs:
      - push
    runs-on: ubuntu-latest

    # Skip this step on pull requests — only deploy real merges to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and load image into Kind cluster
        run: |
          docker build -t session17-python:${{ github.sha }} .

      - name: Create k8s Kind Cluster (For testing deployment)
        uses: helm/kind-action@v1.10.0

      - name: Load image into Kind
        run: |
          kind load docker-image session17-python:${{ github.sha }} --name chart-testing

      - name: Update deployment with new image tag
        run: |
          sed -i "s|session17-python:latest|session17-python:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/session17-python --timeout=60s

      - name: Test running website in CI (Curl)
        run: |
          # Forward the service port to the GitHub runner in the background
          kubectl port-forward service/session17-python 5001:80 &
          sleep 4
          
          echo "🌐 Fetching the website HTML..."
          curl -s http://localhost:5001 | head -n 15
          
          echo -e "\n\n🌐 Fetching the API status..."
          curl -s http://localhost:5001/api/status